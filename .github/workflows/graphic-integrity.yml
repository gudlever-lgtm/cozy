name: Cozy graphic integrity and usage audit

on:
  push:
    branches: [main]
    paths:
      - 'assets/cozy-redesign/**'
      - 'src/**'
      - 'scripts/audit-graphic-usage.mjs'
      - 'src/assets/cozyRedesignImages.ts'
      - 'package.json'
      - '.github/workflows/graphic-integrity.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cozy-graphic-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphics:
    name: Verify image dimensions, references and component ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run source and image integrity audit
        id: audit
        run: npm run audit:graphics
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f work/graphic-audit/report.md ]; then
            cat work/graphic-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Graphic audit produced no report; inspect job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve machine-readable graphic audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozy-graphic-integrity-report
          path: work/graphic-audit/
          if-no-files-found: warn
          retention-days: 3
