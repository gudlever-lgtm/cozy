name: Cozy Android test APK (native Gradle, latest)
# Requested test build v2.1.1 b24: installed version label and original illustrated button assets.

# APK creation is a deliberate action. Source pushes must never trigger it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/apk-requests/**'

permissions:
  contents: write

concurrency:
  group: cozy-android-test-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install QR tool
        run: sudo apt-get update && sudo apt-get install -y qrencode
      - name: Install project dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Engine and presentation tests
        run: npm test
      - name: Native Android and iOS component tests
        run: npm run test:native
      - name: Verify bundled artwork
        run: npm run audit:art
      - name: Check formatting
        run: npm run format:check
      - name: Native JS asset export
        run: npm run export:native
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
      - name: Generate Android native project locally
        run: npx --no-install expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: Compile standalone test APK with Gradle (no EAS)
        run: cd android && bash ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          CI: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Verify APK and prepare QR
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$SIGNER"
          "$SIGNER" verify "$APK"
          mkdir -p out
          VERSION="$(node -p "require('./app.json').expo.version")"
          BUILD="$(node -p "require('./app.json').expo.android.versionCode")"
          FILE="cozy-solitaire-v${VERSION}-b${BUILD}.apk"
          cp "$APK" "out/$FILE"
          cp "$APK" out/cozy-solitaire-test.apk
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/cozy-android-test/$FILE"
          qrencode -o "out/cozy-solitaire-v${VERSION}-b${BUILD}-qr.png" -s 8 -m 2 "$URL"
          qrencode -o out/cozy-solitaire-qr.png -s 8 -m 2 "$URL"
          printf 'Version: %s\\nAndroid build: %s\\nCommit: %s\\nFile: %s\\n' "$VERSION" "$BUILD" "$GITHUB_SHA" "$FILE" > out/BUILD_INFO.txt
          (cd out && sha256sum "$FILE" cozy-solitaire-test.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-android-apk-with-qr
          path: out/
          retention-days: 14
      - name: Publish APK and QR to GitHub test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view cozy-android-test >/dev/null 2>&1; then
            gh release upload cozy-android-test out/* --clobber
            gh release edit cozy-android-test --notes "Testing build from commit ${GITHUB_SHA}. Version and Android build in BUILD_INFO.txt. This is not a production release; native automated checks passed but physical device QA is still required."
          else
            gh release create cozy-android-test out/* \
              --title "Cozy Solitaire Android test APK" --notes "Development/testing build; signed with the Android project test configuration. Not a Play Store release." --prerelease
          fi
