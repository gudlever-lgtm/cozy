name: Cozy Android test APK (native Gradle, latest)
# Explicit on-demand Android test APK; version/build are read from app.json.

# APK creation is a deliberate action. Source pushes must never trigger it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cozy-android-test-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install QR tool
        run: sudo apt-get update && sudo apt-get install -y qrencode
      - name: Install project dependencies
        id: dependencies
        run: |
          mkdir -p diagnostics
          set -o pipefail
          npm ci --include=dev --no-audit --no-fund 2>&1 | tee diagnostics/install.log
      - name: Typecheck
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee diagnostics/typecheck.log
      - name: Engine and presentation tests
        id: engine_tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee diagnostics/engine-tests.log
      - name: Native Android and iOS component tests (diagnostic for test APK)
        id: native_tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:native 2>&1 | tee diagnostics/native-tests.log
      - name: Verify bundled artwork
        id: artwork
        run: |
          set -o pipefail
          npm run audit:art 2>&1 | tee diagnostics/artwork.log
      - name: Check formatting (diagnostic for test APK)
        continue-on-error: true
        run: npm run format:check
      - name: Native JS asset export
        id: native_export
        run: |
          set -o pipefail
          npm run export:native 2>&1 | tee diagnostics/export.log
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
      - name: Generate Android native project locally
        id: prebuild
        run: |
          set -o pipefail
          npx --no-install expo prebuild --platform android --no-install 2>&1 | tee diagnostics/prebuild.log
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: Compile standalone test APK with Gradle (no EAS)
        id: gradle
        run: |
          set -o pipefail
          (cd android && bash ./gradlew :app:assembleRelease --no-daemon --stacktrace) 2>&1 | tee diagnostics/gradle.log
        env:
          CI: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Verify APK and prepare QR
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$SIGNER"
          "$SIGNER" verify "$APK"
          VERSION="$(node -p "require('./app.json').expo.version")"
          BUILD="$(node -p "require('./app.json').expo.android.versionCode")"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          ACTUAL="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$ACTUAL"
          [[ "$ACTUAL" == *"versionCode='$BUILD'"* ]] || { echo "APK versionCode mismatch"; exit 1; }
          [[ "$ACTUAL" == *"versionName='$VERSION'"* ]] || { echo "APK versionName mismatch"; exit 1; }
          mkdir -p out
          FILE="cozy-solitaire-v${VERSION}-b${BUILD}.apk"
          cp "$APK" "out/$FILE"
          cp "$APK" out/cozy-solitaire-test.apk
          TAG="cozy-android-test-v${VERSION}-b${BUILD}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$FILE"
          qrencode -o "out/cozy-solitaire-v${VERSION}-b${BUILD}-qr.png" -s 8 -m 2 "$URL"
          qrencode -o out/cozy-solitaire-qr.png -s 8 -m 2 "$URL"
          printf 'Version: %s\nAndroid build: %s\nCommit: %s\nFile: %s\n' "$VERSION" "$BUILD" "$GITHUB_SHA" "$FILE" > out/BUILD_INFO.txt
          (cd out && sha256sum "$FILE" cozy-solitaire-test.apk > SHA256SUMS.txt)
      - name: Summarize diagnostics on failure
        if: failure()
        env:
          DEPS: ${{ steps.dependencies.outcome }}
          TYPESCRIPT: ${{ steps.typecheck.outcome }}
          ENGINE: ${{ steps.engine_tests.outcome }}
          NATIVE: ${{ steps.native_tests.outcome }}
          ARTWORK: ${{ steps.artwork.outcome }}
          EXPORT: ${{ steps.native_export.outcome }}
          PREBUILD: ${{ steps.prebuild.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
        run: |
          {
            echo "## APK build failure – exact step outcomes"
            echo "| Stage | Outcome |"
            echo "|---|---|"
            for key in DEPS TYPESCRIPT ENGINE NATIVE ARTWORK EXPORT PREBUILD GRADLE; do
              echo "| $key | ${!key} |"
            done
            echo ""
            echo "The first failed required stage is the build blocker. See the diagnostic artifact for its output."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozy-build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-android-apk-with-qr
          path: out/
          retention-days: 3
      - name: Publish APK and QR to GitHub test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          BUILD="$(node -p "require('./app.json').expo.android.versionCode")"
          TAG="cozy-android-test-v${VERSION}-b${BUILD}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes "APK from commit ${GITHUB_SHA}, version ${VERSION}, build ${BUILD}. This is an Android test build, not a production release. Native test failures and device QA are tracked separately."
          else
            gh release create "$TAG" out/* \
              --title "Cozy Solitaire v${VERSION} build ${BUILD} (Android test APK)" \
              --notes "APK from commit ${GITHUB_SHA}. Test build; native tests are diagnostic, not a production release." --prerelease --target "${GITHUB_SHA}"
          fi
