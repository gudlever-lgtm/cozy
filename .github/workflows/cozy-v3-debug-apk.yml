name: Cozy V3 standalone Android APK + QR

on:
  push:
    branches:
      - integration/cozy-v3-visual-garden-solitaire
    paths:
      - .github/workflows/cozy-v3-debug-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cozy-v3-debug-apk
  cancel-in-progress: false

jobs:
  android-standalone:
    name: Build and publish standalone APK with bundled JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      TAG: cozy-v3-integration-e39d096-standalone-v1
      APK_NAME: cozy-v3-integration-e39d096-standalone-v1.apk
      QR_NAME: cozy-v3-integration-e39d096-standalone-v1-qr.png
    steps:
      - name: Checkout exact integration commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Verify standalone release signing configuration
        run: |
          set -euo pipefail
          grep -q 'signingConfig signingConfigs.debug' android/app/build.gradle
          echo "Expo release variant uses debug test signing; not for store distribution."

      - name: Build Android release APK with embedded JavaScript
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace


      - name: Verify APK and digital signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          echo "Check that Hermes/JS bundle is actually embedded in the standalone APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle'
          echo "Embedded JavaScript bundle found; Metro is NOT required."
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          cp "$APK" "$APK_NAME"
          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Create QR for direct release asset URL
        run: |
          set -euo pipefail
          python3 -m pip install --user 'qrcode[pil]'
          python3 - <<'PY'
          import os
          import qrcode
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{os.environ['APK_NAME']}"
          qrcode.make(url).save(os.environ['QR_NAME'])
          print("QR target:", url)
          PY

      - name: Publish pre-release with APK and QR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists; uploading the verified assets"
            gh release upload "$TAG" "$APK_NAME" "$QR_NAME" "$APK_NAME.sha256" --clobber
          else
            gh release create "$TAG" "$APK_NAME" "$QR_NAME" "$APK_NAME.sha256" \
              --target "$GITHUB_SHA" \
              --title "Cozy Solitaire V3 – standalone offline test APK e39d096" \
              --notes "Offline standalone release-mode Android APK from integration/cozy-v3-visual-garden-solitaire with embedded JS (Metro NOT required), test-signed with debug keystore. Not production/store signed. Garden and solitaire visual integration; minigames unchanged. Native UI interactions still need on-device verification." \
              --prerelease
          fi

      - name: Links and checksums
        run: |
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "QR: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$QR_NAME" >> "$GITHUB_STEP_SUMMARY"
          cat "$APK_NAME.sha256" >> "$GITHUB_STEP_SUMMARY"
