name: Validate Cozy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx expo export --platform all --output-dir /tmp/cozy-native --max-workers 2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8081 --bind 127.0.0.1 --directory dist > /tmp/cozy-http.log 2>&1 &
          npm run test:browser
