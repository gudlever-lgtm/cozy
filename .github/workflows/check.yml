name: Validate Cozy Native
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - id: install
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:art
      - run: npm run test:native
      # Validate Metro bundling even when an unrelated Jest test fails.
      # This exports JS/assets only; it does not build an APK.
      - run: npm run export:native
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
